services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gophish
      POSTGRES_PASSWORD: gophish
      POSTGRES_DB: gophish
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gophish -d gophish"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
